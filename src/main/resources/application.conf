kafka {
  bootstrap.servers = "localhost:9092"
  topic = "sensores-data"
  group.id = "streaming-app-group"
}

spark {
  app.name = "KafkaConsumer"
  bronze.checkpoint.location = "C:/tmp/spark-checkpoint-bronze"
  silver.checkpoint.location = "C:/tmp/spark-checkpoint-silver"
  gold.checkpoint.location = "C:/tmp/spark-checkpoint-gold"
  bronze.path = "C:/datos/raw_temperaturas"
  silver.path = "C:/datos/temperaturas_altas"
  gold.path = "C:/datos/temperaturas_medias"
}

hadoop {
  home.dir = "C:/hadoop"
}