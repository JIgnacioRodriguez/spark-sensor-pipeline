status = error
name = PropertiesConfig

# Appender para la consola
appenders = console
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p %c{1} - %m%n

# Root logger: Silencioso para evitar que otras librerías ensucien
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = STDOUT

# 1. Este es el logger que imprime el JSON de progreso cuando procesa datos
logger.streaming_progress.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.streaming_progress.level = info
logger.streaming_progress.additivity = false
logger.streaming_progress.appenderRef.stdout.ref = STDOUT

# 2. Este es el logger que imprime el mensaje de "idle" cuando no hay nada que hacer
logger.streaming_idle.name = org.apache.spark.sql.execution.streaming.StreamExecution
logger.streaming_idle.level = info
logger.streaming_idle.additivity = false
logger.streaming_idle.appenderRef.stdout.ref = STDOUT

# 3. Opcional: tus propios logs siguen funcionando
logger.sensores.name = com.sensores
logger.sensores.level = info
logger.sensores.additivity = false
logger.sensores.appenderRef.stdout.ref = STDOUT